version: 2

models:
  - name: stg_wahis__outbreaks
    description: >
      Staged model of animal disease outbreak CSV export.
      Trims string fields and casts numeric fields to integer. Raw column names 
      have been renamed to snake_case and Null values were handled in the Python 
      ingestion script.

    columns:
      - name: event_id
        description: >
          Event numeric identifier only present in IN/FUR records.

      - name: outbreak_id
        description: >
          Numeric identifier linking rows to a specific outbreak.
          Blank for SMR records. Use this field to identify IN/FUR sourced rows.

      - name: report_year
        description: "Reporting year as an integer from 2005 to 2024."
        tests:
          - not_null

      - name: report_semester
        description: >
          Six-month reporting period. Values follow the pattern:
          'start month - end month YYYY'.
        tests:
          - not_null

      - name: world_region
        description: "World region of the reporting country."
        tests:
          - not_null

      - name: country_name
        description: "Name of reporting country."
        tests:
          - not_null

      - name: administrative_division
        description: >
          Administrative area where the outbreak occurred.

      - name: disease_name_raw
        description: >
          Full WAHIS disease name using formal nomenclature, including
          taxonomic qualifiers and year suffixes. Long and inconsistently
          formatted across years.
        tests:
          - not_null

      - name: serotype
        description: >
          Strain, serotype, or genotype detail where available. Blank for
          most diseases.

      - name: animal_category
        description: "Category that classifies the affected animals in Domestic or Wild."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Domestic', 'Wild', 'Both animal categories']

      - name: species
        description: >
          Animal species affected by the outbreak. Blank for summary rows.
          Use this field to identify detailed rows both IN/FUR and SMR sourced.

      - name: new_outbreaks
        description: >
          Number of new outbreaks per semester.
          For IN/FUR records, only one species row per outbreak carries
          the count — remaining rows show 0 to avoid double counting.
          Use only the SMR sourced summary rows for new_outbreaks metrics.

      - name: case_count
        description: >
          Number of confirmed cases in this record. NULL represents missing 
          data, not zero cases.

      - name: death_count
        description: >
          Number of animals that died from the disease. NULL represents
          missing data, not zero deaths.

      - name: killed_count
        description: >
          Number of animals killed and disposed of as a disease control
          measure. NULL represents missing data, not zero.

      - name: slaughtered_count
        description: >
          Number of animals slaughtered. NULL represents missing data,
          not zero.

      - name: vaccinated_count
        description: >
          Number of animals vaccinated. NULL represents missing data,
          not zero.

      - name: susceptible_count
        description: >
          Estimated population at risk. NULL represents missing data,
          not zero.

      - name: measuring_units
        description: >
          Unit of measurement for quantitative fields.
          E.g. 'Animals', 'Tons' or 'Hives'.