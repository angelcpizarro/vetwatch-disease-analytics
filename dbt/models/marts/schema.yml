version: 2

models:
  - name: mart_disease_trends
    description: >
      Analysis-ready table of outbreak trends by disease, disease category, region, 
      country, and time. 
      Primary data source for the disease trends dashboard page and the geographic
      breakdown dashboard page.

    columns:
      - name: total_outbreaks
        description: "Sum of new outbreaks from a SMR summary row level."

      - name: total_cases
        description: "Sum of cases from a detail row level."

      - name: total_deaths
        description: "Sum of deaths from a detail row level."

      - name: total_vaccinated
        description: "Sum of vaccinated animals from a detail row level."

  - name: mart_data_quality_summary
    description: >
      One row per country. Contains total outbreak counts, percentage of
      completeness per parameter, composite quality score, and quality band 
      classification. 
      Primary data source for the data quality dashboard page.

    columns:
      - name: quality_band
        description: "High (≥70), Medium (≥40), or Low (<40) based on composite score."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']